<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="modalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090e14"/>
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="editBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Backdrop with Shadow -->
  <rect width="880" height="520" rx="14" fill="url(#modalBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Modal Header Bar -->
  <rect x="0" y="0" width="880" height="58" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="28" cy="29" r="6" fill="#f59e0b"/>
  <text x="44" y="34" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Human-in-the-Loop Approval Queue</text>
  <text x="315" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">|</text>
  <text x="328" y="34" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Review Item #TR-9A82B1C4</text>

  <!-- Review Urgency Badge -->
  <rect x="680" y="16" width="175" height="26" rx="13" fill="#312211" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="694" cy="29" r="4" fill="#f59e0b"/>
  <text x="705" y="33" fill="#fcd34d" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">NEEDS COACH DECISION</text>

  <!-- Two Column Layout -->
  <!-- Left Column: Inbound Proof & Retrieved Context -->
  <rect x="25" y="74" width="530" height="340" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>

  <!-- Client Header -->
  <circle cx="48" cy="100" r="14" fill="#1e293b"/>
  <text x="42" y="105" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">#104</text>
  <text x="70" y="98" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Client #104 (Executive Cohort)</text>
  <text x="70" y="114" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">WhatsApp Ingress · 07:12:18 AM</text>

  <!-- Inbound Text Bubble -->
  <rect x="40" y="130" width="500" height="54" rx="8" fill="#090e14" stroke="#334155" stroke-width="0.75"/>
  <text x="52" y="152" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">"Finished the 5 miles in 42 mins. Knee felt slightly tight at mile 4 but stretched</text>
  <text x="52" y="170" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">after. Submitting split screenshot."</text>

  <!-- Grounding Context Extracted via pgvector -->
  <rect x="40" y="196" width="500" height="78" rx="8" fill="#09141c" stroke="#0284c7" stroke-width="0.75"/>
  <text x="52" y="215" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PGVECTOR GROUNDED CONTEXT (Cosine Sim: 0.892)</text>
  <text x="52" y="233" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Habit Contract #12: Sub-45 min 5-mile tempo run, 3x/weekly target.</text>
  <text x="52" y="250" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Coach Sarah Protocol: If right patellar tightness occurs, 10 min cold compress.</text>
  <text x="52" y="266" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Matched Chunks: habit_contract:1082, coach_playbook:1085</text>

  <!-- AI Draft Proposed Response -->
  <rect x="40" y="286" width="500" height="114" rx="8" fill="#13231f" stroke="#22c55e" stroke-width="0.75"/>
  <text x="52" y="306" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">AI PROPOSED WHATSAPP DISPATCH (Confidence: 91%)</text>
  <text x="52" y="328" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12">"Great pacing on the 42-minute split! Since that right knee felt tight around mile 4,</text>
  <text x="52" y="346" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12">make sure you do 10 minutes with the cold compress today before lunch. Let's see</text>
  <text x="52" y="364" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12">how it feels tomorrow morning."</text>
  <text x="52" y="388" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">⚠️ Queue Trigger: Joint symptom detected — coach confirmation required before send.</text>

  <!-- Right Column: Audit Telemetry & Coach Metadata -->
  <rect x="575" y="74" width="280" height="340" rx="10" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
  <text x="595" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Audit &amp; Guardrail Telemetry</text>

  <rect x="590" y="118" width="250" height="280" rx="8" fill="#090e14" stroke="#1e293b" stroke-width="0.75"/>
  <text x="605" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">PROMPT INJECTION VERDICT</text>
  <text x="605" y="158" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">0.00 (Passed Boundary Check)</text>

  <text x="605" y="188" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">CANARY TOKEN VALIDATION</text>
  <text x="605" y="206" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Zero Leakage Confirmed</text>

  <text x="605" y="236" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">TOKEN CONSUMPTION &amp; COST</text>
  <text x="605" y="254" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12">482 in / 114 out (596 total)</text>
  <text x="605" y="272" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Cost: $0.000104 USD</text>

  <text x="605" y="302" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">INGRESS TO DRAFT LATENCY</text>
  <text x="605" y="320" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">612ms total pipeline time</text>

  <text x="605" y="350" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ASSIGNED COACH</text>
  <text x="605" y="368" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Coach Sarah M. (Lead Physiotherapist)</text>

  <!-- Bottom Actions Footer Bar -->
  <rect x="0" y="434" width="880" height="86" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- 1-Click Approve Button -->
  <rect x="25" y="452" width="260" height="46" rx="8" fill="url(#primaryBtn)"/>
  <text x="50" y="480" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✓ 1-Click Approve &amp; Dispatch</text>

  <!-- Edit Draft Button -->
  <rect x="300" y="452" width="160" height="46" rx="8" fill="url(#editBtn)"/>
  <text x="330" y="480" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✎ Quick Edit</text>

  <!-- Request Photo Evidence -->
  <rect x="475" y="452" width="220" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="495" y="480" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📷 Request Photo Proof</text>

  <!-- Discard Button -->
  <rect x="710" y="452" width="145" height="46" rx="8" fill="#2d1215" stroke="#ef4444" stroke-width="0.75"/>
  <text x="735" y="480" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✕ Discard</text>
</svg>
