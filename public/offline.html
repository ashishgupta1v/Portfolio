<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Ashish Gupta</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 300 900;
            font-display: swap;
            src: url('/fonts/inter-latin-var.woff2') format('woff2');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #090e14;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
        }
        .wrap { max-width: 34rem; }
        .mark {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            color: #5eead4;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            text-wrap: balance;
            margin-bottom: 0.75rem;
        }
        p {
            color: #94a3b8;
            line-height: 1.65;
            margin-bottom: 2rem;
        }
        button {
            font: inherit;
            font-weight: 600;
            padding: 0.7rem 1.6rem;
            border: 1px solid rgba(94, 234, 212, 0.35);
            border-radius: 0.5rem;
            background: rgba(94, 234, 212, 0.1);
            color: #5eead4;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: rgba(94, 234, 212, 0.18); }
        button:focus-visible { outline: 2px solid #5eead4; outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="mark">AG</div>
        <h1>You're offline</h1>
        <p>This page hasn't been cached yet. Reconnect and it'll load right up.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
